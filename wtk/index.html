<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wonders Words to Know Week 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  /* One column, one word at a time: the paper workbook's card, made tappable. */
  --blue:#0B2FA8; --blue-soft:#E7ECFF; --yellow:#FFC530; --yellow-soft:#FFF4CF;
  --heart:#E8457A; --ink:#14204A; --muted:#55608A; --paper:#FFFFFF; --ground:#F2F4FC; --line:#D5DBF2;
  --word:"Andika","Comic Sans MS",sans-serif; --ui:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{background:var(--blue);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.story{font-family:var(--word);font-weight:700;font-size:20px;margin:0}
.slow{border:2px solid var(--blue);background:var(--paper);color:var(--blue);border-radius:999px;padding:8px 14px;font-weight:700;min-height:44px}
.slow[aria-pressed="true"]{background:var(--blue);color:#fff}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 8px;font-weight:700;min-height:48px;font-family:var(--word)}
.tab[aria-selected="true"]{border-color:var(--blue);background:var(--blue);color:#fff}
.tab small{display:block;font-family:var(--ui);font-weight:500;font-size:11px;opacity:.85}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-family:var(--word);font-size:16px;min-height:40px}
.chip[aria-current="true"]{border-color:var(--blue);color:var(--blue);font-weight:700}
.chip.done{background:var(--yellow-soft);border-color:var(--yellow)}
.chip.done::after{content:" ★";color:#B07A00}
.card{background:var(--paper);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:stretch}
.wordbox{border:3px solid var(--blue);border-radius:16px;box-shadow:3px 3px 0 var(--yellow);padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.bigword{font-family:var(--word);font-weight:700;font-size:clamp(36px,11vw,52px);color:var(--blue);line-height:1.15;border-bottom:2px solid var(--blue);padding:0 14px}
.sub{font-family:var(--word);font-size:16px}
.sub b{color:var(--blue);border-bottom:3px solid var(--yellow)}
.photo{width:100%;height:100%;min-height:110px;object-fit:cover;border-radius:14px;display:block}
.step{display:flex;flex-direction:column;gap:10px}
.step h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;font-family:var(--word)}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--yellow);color:var(--ink);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-family:var(--ui)}
.hint{margin:0;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:10px 16px;min-height:46px;font-weight:700;background:var(--blue);color:#fff}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.btn.good{background:var(--yellow);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.stars{display:flex;gap:4px;font-size:26px;line-height:1;color:var(--line)}
.stars .on{color:#F2A900}
.status{font-weight:700;color:var(--blue);min-height:22px}
.sounds{display:flex;gap:8px;flex-wrap:wrap}
.sound{position:relative;border:2px solid var(--line);background:var(--paper);border-radius:12px;min-width:58px;min-height:64px;padding:16px 12px 8px;font-family:var(--word);font-size:26px}
.sound::before{content:"";position:absolute;top:8px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--blue)}
.sound.tricky{background:#FFE9F0;border-color:#F7B6CB}
.sound.tricky::before{background:var(--heart);border-radius:2px;transform:rotate(45deg)}
.sound.hit{border-color:var(--blue);background:var(--blue-soft)}
.sound.tricky.hit{border-color:var(--heart)}
.legend{font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;background:var(--heart);transform:rotate(45deg);margin-right:6px;border-radius:2px}
canvas{width:100%;height:120px;border-radius:12px;background:#fff;border:1px solid var(--line);touch-action:none;display:block}
.act{background:var(--yellow-soft);border-radius:12px;padding:10px 14px;font-size:14px}
.question{font-family:var(--word);font-size:18px}
.yn{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 18px;min-height:46px;font-family:var(--word);font-size:17px}
.yn[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);font-weight:700}
.nav{display:flex;justify-content:space-between;gap:8px}
.note{font-size:12px;color:var(--muted);margin:0}
.warn{background:#FFE9F0;border-radius:12px;padding:10px 14px;font-size:13px;display:none}
.overlay{position:fixed;inset:0;background:rgba(11,47,168,.92);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
.overlay.show{display:flex}
.praise{background:var(--paper);border-radius:24px;padding:24px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.praise img{height:150px;width:auto}
.praise h3{margin:0;font-family:var(--word);font-size:30px;color:var(--blue)}
.praise p{margin:0}
@media (prefers-reduced-motion:no-preference){.praise img{animation:hop .6s ease-out 2}}
@keyframes hop{50%{transform:translateY(-14px)}}
@media (max-width:380px){.hero{grid-template-columns:1fr}.photo{height:140px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="pills"><span class="pill">Grade 1.1 · Week 1</span><span class="pill" style="background:var(--yellow);color:var(--ink)">Wonders · Words to Know</span></div>
      <h1 class="story">Jack Can</h1>
    </div>
    <button class="slow" id="slow" type="button" aria-pressed="false">천천히 듣기</button>
  </div>
  <div class="warn" id="warn">이 브라우저에서는 소리를 읽어 줄 수 없어요. Safari나 Chrome에서 열어 주세요.</div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-hfw" role="tab" type="button">High-Frequency Words<small>바로 읽고 쓰는 단어 4개</small></button>
    <button class="tab" id="tab-wtk" role="tab" type="button">Words to Know<small>뜻을 알고 말하는 단어 6개</small></button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="card" id="card"></div>
  <div class="nav">
    <button class="btn ghost" id="prev" type="button">이전 단어</button>
    <button class="btn ghost" id="next" type="button">다음 단어</button>
  </div>
  <p class="note">별 표시는 이 기기에만 저장돼요. 쓰기 연습은 화면을 나가면 지워져요.</p>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="praise-title">
  <div class="praise">
    <img src="img/cooneo.png" alt="엄지를 든 쿠니오">
    <h3 id="praise-title">Great job!</h3>
    <p id="praise-text"></p>
    <button class="btn" id="praise-next" type="button">다음 단어로</button>
  </div>
</div>
<script>
const DATA={
  hfw:[
    {w:"does",s:"What does Dan do?",sounds:[["d"],["oe",1],["s"]]},
    {w:"not",s:"Do not run in school.",sounds:[["n"],["o"],["t"]]},
    {w:"school",s:"We read a lot at school.",sounds:[["s"],["ch",1],["oo"],["l"]]},
    {w:"what",s:"What can we play today?",sounds:[["wh"],["a",1],["t"]]}
  ],
  wtk:[
    {w:"our",s:"This is our dog.",q:"Is this our dog?",act:"두 팔로 가족을 감싸 안아요."},
    {w:"helps",s:"makes a job easier for someone",q:"Do you help your mom?",act:"무거운 물건을 같이 들어 주는 동작을 해요."},
    {w:"likes",s:"thinks something is good",q:"Do you like ice cream?",act:"엄지를 들고 활짝 웃어요."},
    {w:"paint",s:"make a picture with paint and a brush",q:"Do you paint with a spoon?",act:"붓으로 그림을 그리는 동작을 해요."},
    {w:"reach",s:"stretch your arm to get something",q:"Can you reach the sky?",act:"팔을 위로 쭉 뻗어요."},
    {w:"sad",s:"feeling unhappy",q:"Are you sad on your birthday?",act:"슬픈 표정을 지어요."}
  ]
};
const KEY="wtk-g11-w1";
let tab="hfw",idx=0,slow=false,run=0,voice=null;
let done={},reps={},yn={};
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){done={}}
const $=id=>document.getElementById(id);
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const canSpeak="speechSynthesis" in window;
function pickVoice(){
  if(!canSpeak)return;
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  voice=vs.find(v=>/Samantha|Google US English|Jenny|Aria/i.test(v.name))||vs[0]||null;
}
if(canSpeak){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}else{$("warn").style.display="block"}
function say(text){
  return new Promise(res=>{
    if(!canSpeak){res();return}
    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang="en-US";u.rate=slow?0.55:0.9;if(voice)u.voice=voice;
      u.onend=res;u.onerror=res;speechSynthesis.speak(u);
    }catch(e){res()}
  });
}
function stopAll(){run++;if(canSpeak){try{speechSynthesis.cancel()}catch(e){}}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const cur=()=>DATA[tab][idx];
function mark(sentence,word){
  const re=new RegExp("\\b("+word+")\\b","i");
  return esc(sentence).replace(re,"<b>$1</b>");
}
function renderChips(){
  $("tab-hfw").setAttribute("aria-selected",tab==="hfw");
  $("tab-wtk").setAttribute("aria-selected",tab==="wtk");
  $("chips").innerHTML=DATA[tab].map((d,i)=>
    `<button type="button" class="chip${done[d.w]?" done":""}" data-i="${i}" aria-current="${i===idx}">${d.w}</button>`).join("");
}
function starsHtml(n){return [0,1,2].map(i=>`<span class="${i<n?"on":""}">★</span>`).join("")}
function render(){
  stopAll();
  const d=cur(),isH=tab==="hfw",n=reps[d.w]||0;
  let h=`<div class="hero">
    <div class="wordbox"><div class="bigword">${d.w}</div><div class="sub">${mark(d.s,d.w)}</div></div>
    <img class="photo" src="img/${d.w}.jpg" alt="${d.w} 그림">
  </div>
  <div class="step">
    <h2><span class="num">QR</span>${isH?"Listen and repeat 3 times.":"Listen, repeat, and act it out."}</h2>
    <div class="row">
      <button class="btn" id="listen" type="button">▶ Listen</button>
      <button class="btn ghost" id="repeat" type="button">3번 따라 말하기</button>
      <div class="stars" id="stars" aria-label="따라 말한 횟수">${starsHtml(n)}</div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="row"><button class="btn good" id="praise" type="button" ${n<3?"disabled":""}>잘했어요! (학부모님이 눌러 주세요)</button></div>
  </div>`;
  if(isH){
    h+=`<div class="step">
      <h2><span class="num">1</span>Tap and say each sound.</h2>
      <p class="hint">소리 칸을 하나씩 짚으며 소리를 내요. 다 짚으면 합쳐서 읽어 줘요.</p>
      <div class="sounds" id="sounds">${d.sounds.map((s,i)=>`<button type="button" class="sound${s[1]?" tricky":""}" data-s="${i}">${s[0]}</button>`).join("")}</div>
      ${d.sounds.some(s=>s[1])?'<div class="legend"><i></i>규칙과 다르게 소리 나는 부분이에요.</div>':""}
      <div class="row"><button class="btn ghost" id="blend" type="button">합쳐 읽기</button></div>
    </div>`;
  }else{
    h+=`<div class="act"><b>몸으로 표현해요.</b> ${d.act}</div>`;
  }
  h+=`<div class="step">
    <h2><span class="num">${isH?2:1}</span>Trace once, then write it two times.</h2>
    <canvas id="pad" aria-label="${d.w} 따라 쓰기 칸"></canvas>
    <div class="row"><button class="btn ghost" id="clear" type="button">지우고 다시 쓰기</button></div>
  </div>`;
  if(!isH){
    h+=`<div class="step">
      <h2><span class="num">2</span>Yes or No?</h2>
      <div class="row"><button class="btn" id="ask" type="button" aria-label="질문 듣기">▶</button><span class="question">${esc(d.q)}</span></div>
      <div class="row">
        <button type="button" class="yn" data-yn="yes" aria-pressed="${yn[d.w]==="yes"}">😊 Yes</button>
        <button type="button" class="yn" data-yn="no" aria-pressed="${yn[d.w]==="no"}">☹ No</button>
      </div>
      <p class="hint">정답보다 뜻을 생각하며 영어로 대답하는 것이 중요해요.</p>
    </div>`;
  }
  $("card").innerHTML=h;
  renderChips();
  $("prev").disabled=idx===0&&tab==="hfw";
  $("next").disabled=idx===DATA[tab].length-1&&tab==="wtk";
  bind(d,isH);
  setupPad(d.w);
}
function setStatus(t){const el=$("status");if(el)el.textContent=t}
function bind(d,isH){
  $("listen").onclick=async()=>{stopAll();const r=run;setStatus("잘 들어 보세요.");await say(d.w);if(r!==run)return;await wait(350);if(r!==run)return;await say(d.s);if(r===run)setStatus("")};
  $("repeat").onclick=async()=>{
    stopAll();const r=run;reps[d.w]=0;$("stars").innerHTML=starsHtml(0);$("praise").disabled=true;
    for(let i=0;i<3;i++){
      setStatus((i+1)+"번째: 잘 들어 보세요.");await say(d.w);if(r!==run)return;
      setStatus("따라 말해요!");await wait(slow?2800:1900);if(r!==run)return;
      reps[d.w]=i+1;$("stars").innerHTML=starsHtml(i+1);
    }
    setStatus("3번 다 했어요. 학부모님이 확인해 주세요.");$("praise").disabled=false;
  };
  $("praise").onclick=()=>{
    stopAll();done[d.w]=true;try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}
    renderChips();
    const all=[...DATA.hfw,...DATA.wtk],left=all.filter(x=>!done[x.w]).length;
    $("praise-text").textContent=left?`"${d.w}" 완료! 남은 단어 ${left}개`:"이번 주 단어를 모두 마쳤어요!";
    $("praise-next").textContent=left?"다음 단어로":"닫기";
    $("overlay").classList.add("show");$("praise-next").focus();
  };
  if(isH){
    const boxes=[...document.querySelectorAll(".sound")];
    boxes.forEach(b=>b.onclick=()=>{b.classList.add("hit");if(boxes.every(x=>x.classList.contains("hit"))){stopAll();say(d.w)}});
    $("blend").onclick=async()=>{
      stopAll();const r=run;boxes.forEach(x=>x.classList.remove("hit"));
      for(const b of boxes){b.classList.add("hit");await wait(slow?900:550);if(r!==run)return}
      await say(d.w);
    };
  }else{
    $("ask").onclick=()=>{stopAll();say(d.q)};
    document.querySelectorAll(".yn").forEach(b=>b.onclick=()=>{yn[d.w]=b.dataset.yn;document.querySelectorAll(".yn").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  }
}
/* Writing pad: four-line guide, a dotted word to trace, two empty slots to write alone. */
let strokes=[];
function setupPad(word){
  const c=$("pad");strokes=[];let drawing=null;
  function paint(){
    const dpr=window.devicePixelRatio||1,w=c.clientWidth,hh=c.clientHeight;
    c.width=Math.round(w*dpr);c.height=Math.round(hh*dpr);
    const x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,hh);
    const top=22,base=84,mid=(top+base)/2,desc=106;
    x.lineWidth=1;x.strokeStyle="#C9D2F0";
    [top,desc].forEach(y=>{x.beginPath();x.moveTo(8,y);x.lineTo(w-8,y);x.stroke()});
    x.setLineDash([4,5]);x.beginPath();x.moveTo(8,mid);x.lineTo(w-8,mid);x.stroke();x.setLineDash([]);
    x.strokeStyle="#0B2FA8";x.lineWidth=2;x.beginPath();x.moveTo(8,base);x.lineTo(w-8,base);x.stroke();
    const size=Math.round((base-top)*1.02);
    x.font=`400 ${size}px Andika, "Comic Sans MS", sans-serif`;x.textBaseline="alphabetic";
    const tw=x.measureText(word).width,first=Math.min((w-16)*0.5,Math.max((w-16)/3,tw+26)),slot=(w-16-first)/2;
    const scale=Math.min(1,(first-20)/tw);
    x.save();x.translate(14,base);x.scale(scale,1);
    x.setLineDash([2,4]);x.lineWidth=1.6;x.strokeStyle="#7F8DC4";x.strokeText(word,0,0);x.restore();x.setLineDash([]);
    x.strokeStyle="#C9D2F0";x.lineWidth=1;x.fillStyle="#8A94BD";x.font='500 11px "Noto Sans KR", sans-serif';
    [1,2].forEach(i=>{const sx=8+first+slot*(i-1);x.beginPath();x.moveTo(sx,top);x.lineTo(sx,desc);x.stroke();x.fillText(String(i+1),sx+6,top-6)});
    x.strokeStyle="#14204A";x.lineWidth=3.2;x.lineCap="round";x.lineJoin="round";
    strokes.forEach(s=>{x.beginPath();s.forEach((p,i)=>i?x.lineTo(p[0]*w,p[1]*hh):x.moveTo(p[0]*w,p[1]*hh));if(s.length===1)x.lineTo(s[0][0]*w+.1,s[0][1]*hh);x.stroke()});
  }
  const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
  c.onpointerdown=e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}drawing=[pos(e)];strokes.push(drawing);paint()};
  c.onpointermove=e=>{if(!drawing)return;drawing.push(pos(e));paint()};
  c.onpointerup=c.onpointercancel=()=>{drawing=null};
  $("clear").onclick=()=>{strokes=[];paint()};
  window.onresize=paint;
  paint();
  if(document.fonts&&document.fonts.load){document.fonts.load('400 60px Andika').then(()=>{if($("pad")===c)paint()}).catch(()=>{})}
}
function go(step){
  const list=DATA[tab];
  if(idx+step>=list.length){if(tab==="hfw"){tab="wtk";idx=0}else return}
  else if(idx+step<0){if(tab==="wtk"){tab="hfw";idx=DATA.hfw.length-1}else return}
  else idx+=step;
  render();window.scrollTo(0,0);
}
$("prev").onclick=()=>go(-1);
$("next").onclick=()=>go(1);
$("tab-hfw").onclick=()=>{tab="hfw";idx=0;render()};
$("tab-wtk").onclick=()=>{tab="wtk";idx=0;render()};
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(b){idx=+b.dataset.i;render()}};
$("slow").onclick=()=>{slow=!slow;$("slow").setAttribute("aria-pressed",slow);$("slow").textContent=slow?"천천히 듣는 중":"천천히 듣기"};
$("praise-next").onclick=()=>{$("overlay").classList.remove("show");go(1)};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("overlay").classList.remove("show")});
render();
</script>
</body>
</html>
